# Dedicated recovery regression topology; never use the daily or Figma databases.
services:
  keycloak-db:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: isolated-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 2s
      timeout: 2s
      retries: 30
  keycloak:
    build:
      context: .
      dockerfile: infra/keycloak/Dockerfile
    command: start-dev --import-realm --vault=file --vault-dir=/opt/keycloak/vault
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: isolated-test-only
      KC_BOOTSTRAP_ADMIN_USERNAME: figma-test-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: figma-test-admin-password
      KC_HOSTNAME: http://127.0.0.1:8480
    ports: ["127.0.0.1:8480:8080"]
    volumes:
      - ./.verification/password-reset/realm.json:/opt/keycloak/data/import/realm.json:ro
      - ./.verification/password-reset/vault:/opt/keycloak/vault:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
      mail:
        condition: service_started
  mail:
    image: axllent/mailpit:v1.27.8
    ports: ["127.0.0.1:8125:8025"]
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: knora
      POSTGRES_USER: knora
      POSTGRES_PASSWORD: isolated-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knora -d knora"]
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: sh -c "alembic upgrade head && uvicorn knora.main:app --host 0.0.0.0 --port 8000"
    environment:
      KNORA_DATABASE_URL: postgresql+psycopg://knora:isolated-test-only@postgres:5432/knora
      KNORA_KEYCLOAK_ISSUER: http://127.0.0.1:8480/realms/knora-dev
      KNORA_KEYCLOAK_AUDIENCE: knora-web
      KNORA_KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/knora-dev/protocol/openid-connect/certs
    ports: ["127.0.0.1:8900:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
