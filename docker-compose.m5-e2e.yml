services:
  minio:
    environment:
      MINIO_ROOT_USER: m5-e2e-minio-access
      MINIO_ROOT_PASSWORD: m5-e2e-minio-secret

  minio-init:
    environment:
      MINIO_ROOT_USER: m5-e2e-minio-access
      MINIO_ROOT_PASSWORD: m5-e2e-minio-secret

  api:
    environment:
      KNORA_OBJECT_STORE_S3_ACCESS_KEY: m5-e2e-minio-access
      KNORA_OBJECT_STORE_S3_SECRET_KEY: m5-e2e-minio-secret
      KNORA_KEYCLOAK_ISSUER: http://127.0.0.1:8180/realms/m5-e2e
      KNORA_KEYCLOAK_AUDIENCE: knora-web
      KNORA_KEYCLOAK_JWKS_URL: http://keycloak-m5-e2e:8080/realms/m5-e2e/protocol/openid-connect/certs

  keycloak-m5-e2e:
    image: quay.io/keycloak/keycloak:26.3.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: m5-e2e-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: m5-e2e-admin-password
    ports:
      - "127.0.0.1:8180:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/m5-e2e/.well-known/openid-configuration HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q '200 OK' <&3
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    volumes:
      - ./test/fixtures/keycloak/m5-realm.json:/opt/keycloak/data/import/m5-e2e-realm.json:ro
      - keycloak_m5_e2e_data:/opt/keycloak/data

volumes:
  keycloak_m5_e2e_data:
