services:
  keycloak-m5-e2e:
    image: quay.io/keycloak/keycloak:26.3.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: m5-e2e-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: m5-e2e-admin-password
    ports:
      - "127.0.0.1:8180:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/m5-e2e/.well-known/openid-configuration HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q '200 OK' <&3
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    volumes:
      - ./test/fixtures/keycloak/m5-realm.json:/opt/keycloak/data/import/m5-e2e-realm.json:ro
      - knora_m5_e2e_keycloak_data:/opt/keycloak/data

volumes:
  knora_m5_e2e_keycloak_data:
