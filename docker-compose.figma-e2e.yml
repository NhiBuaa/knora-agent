name: knora-figma-e2e

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: knora
      POSTGRES_USER: knora
      POSTGRES_PASSWORD: figma-test-database
    ports: ["127.0.0.1:5543:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knora -d knora"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  keycloak-db:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: figma-test-keycloak-database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes: ["keycloak_database:/var/lib/postgresql/data"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: start-dev --import-realm --spi-theme--cache-themes=false --spi-theme--cache-templates=false --spi-theme--static-max-age=-1
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: figma-test-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: figma-test-admin-password
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: figma-test-keycloak-database
      KC_HOSTNAME: http://127.0.0.1:8380
    ports: ["127.0.0.1:8380:8080"]
    depends_on:
      keycloak-db: { condition: service_healthy }
      mail: { condition: service_started }
    volumes:
      - ./test/fixtures/keycloak/figma-realm.json:/opt/keycloak/data/import/knora-dev-realm.json:ro
      - ./themes/knora:/opt/keycloak/themes/knora:ro

  mail:
    image: axllent/mailpit:v1.27.8
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: figma-test-minio
      MINIO_ROOT_PASSWORD: figma-test-minio-password
    ports: ["127.0.0.1:9900:9000", "127.0.0.1:9901:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes: ["minio_data:/data"]

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 figma-test-minio figma-test-minio-password >/dev/null && mc mb --ignore-existing local/knora"]

  api:
    build: { context: ./backend }
    environment:
      KNORA_DATABASE_URL: postgresql+psycopg://knora:figma-test-database@postgres:5432/knora
      KNORA_KEYCLOAK_ISSUER: http://127.0.0.1:8380/realms/knora-dev
      KNORA_KEYCLOAK_AUDIENCE: knora-web
      KNORA_KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/knora-dev/protocol/openid-connect/certs
      KNORA_OBJECT_STORE_BACKEND: s3_compatible
      KNORA_OBJECT_STORE_S3_ENDPOINT: http://minio:9000
      KNORA_OBJECT_STORE_S3_BUCKET: knora
      KNORA_OBJECT_STORE_S3_REGION: us-east-1
      KNORA_OBJECT_STORE_S3_ACCESS_KEY: figma-test-minio
      KNORA_OBJECT_STORE_S3_SECRET_KEY: figma-test-minio-password
    ports: ["127.0.0.1:8800:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      keycloak: { condition: service_started }

volumes:
  postgres_data: {}
  keycloak_database: {}
  minio_data: {}
