[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "knora-agent"
version = "0.1.0"
description = "Cited knowledge agent for support teams"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pgvector>=0.3,<1",
  "psutil==7.2.2",
  "psycopg[binary]>=3.2,<4",
  "pypdf==6.14.2",
  "PyJWT[crypto]>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "tiktoken==0.12.0",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff==0.17.0",
]
evaluation-deepeval = ["deepeval==4.2.8"]
evaluation-ragas = ["ragas==0.4.3", "langchain-community==0.3.31"]
evaluation-langfuse = ["langfuse==4.17.0"]

[project.scripts]
knora-ingest = "knora.adapters.cli.ingest:main"

[tool.hatch.build.targets.wheel]
packages = ["src/knora"]

[tool.pytest.ini_options]
addopts = "-p no:deepeval"
pythonpath = ["src"]
testpaths = ["backend/test"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["knora"]
