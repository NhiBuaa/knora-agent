<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Knora — document Q&amp;A with RAG</title>
  <desc id="desc">An original Knora wordmark beside a document connected to a cited evidence card, in the application's forest green, mint and copper palette.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0B1412"/>
      <stop offset="1" stop-color="#1B2B25"/>
